name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip
      
      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip -d $HOME
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r25c" >> $GITHUB_ENV
      
      - name: Auto increment version
        run: |
          CURRENT_VERSION=$(grep '^version=' module.prop | cut -d'v' -f2)
          MAJOR=$(echo $CURRENT_VERSION | cut -d'.' -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d'.' -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d'.' -f3)
          
          NEW_MINOR=$((MINOR + 1))
          NEW_MAJOR=$MAJOR
          
          if [ $NEW_MINOR -ge 10 ]; then
            NEW_MINOR=0
            NEW_MAJOR=$((MAJOR + 1))
          fi
          
          NEW_PATCH=$(( (RANDOM % 10) + 1 ))
          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          
          sed -i "s/^version=v.*/version=v${NEW_VERSION}/" module.prop
          VERSION_CODE=$((NEW_MAJOR * 100 + NEW_MINOR * 10 + NEW_PATCH))
          sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" module.prop
          
          echo "VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "New version: v${NEW_VERSION}"
      
      - name: Build
        run: |
          export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
          export STRIP=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          make CC=$CC
          bash build.sh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargeControl_v${{ env.VERSION }}
          path: out/*.zip
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "ChargeControl v${{ env.VERSION }}"
          body: |
            ## ChargeControl v${{ env.VERSION }}
            
            ### 📦 下载安装
            1. 下载下方 ZIP 文件
            2. 打开 KernelSU 管理器 → 模块 → 从存储安装
            3. 选择下载的 ZIP 文件
            4. 重启设备
            
            ### 🔗 访问 Web UI
            浏览器访问: http://127.0.0.1:8080
            
            ### 📝 更新内容
            - 自动版本递增: minor+1, patch=随机(1-10)
            - 科技感UI全新设计
            - SSE实时数据推送
            - 动态帧率适配(0~165fps)
            - 智能电池路径发现
            - 双电芯支持
            - 完整数据验证
          files: out/*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Push version update
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add module.prop
          git commit -m "chore: auto bump version to v${{ env.VERSION }}" || true
          git push
