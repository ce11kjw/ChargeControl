name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      
      - name: Auto increment version
        run: |
          # 读取当前版本
          CURRENT_VERSION=$(grep '^version=' module.prop | cut -d'v' -f2)
          MAJOR=$(echo $CURRENT_VERSION | cut -d'.' -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d'.' -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d'.' -f3)
          
          echo "当前版本: ${MAJOR}.${MINOR}.${PATCH}"
          
          # minor+1
          NEW_MINOR=$((MINOR + 1))
          NEW_MAJOR=$MAJOR
          
          # 如果minor到10，major+1，minor归0
          if [ $NEW_MINOR -ge 10 ]; then
            NEW_MINOR=0
            NEW_MAJOR=$((MAJOR + 1))
          fi
          
          # patch随机1-10
          NEW_PATCH=$(( (RANDOM % 10) + 1 ))
          
          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "新版本: ${NEW_VERSION}"
          
          # 更新 module.prop
          sed -i "s/^version=v.*/version=v${NEW_VERSION}/" module.prop
          
          # 更新 versionCode (major*100 + minor*10 + patch)
          VERSION_CODE=$((NEW_MAJOR * 100 + NEW_MINOR * 10 + NEW_PATCH))
          sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" module.prop
          
          echo "VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
      
      - name: Build
        run: |
          make CC=aarch64-linux-android33-clang
          bash build.sh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargeControl_v${{ env.VERSION }}
          path: out/*.zip
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: "ChargeControl v${{ env.VERSION }}"
          body: |
            ## ChargeControl v${{ env.VERSION }}
            
            ### 📦 下载安装
            1. 下载下方 ZIP 文件
            2. 打开 KernelSU 管理器 → 模块 → 从存储安装
            3. 选择下载的 ZIP 文件
            4. 重启设备
            
            ### 🔗 访问 Web UI
            浏览器访问: http://127.0.0.1:8080
            
            ### 📝 更新内容
            - 自动版本递增: minor+1, patch=随机(1-10)
            - 科技感UI全新设计
            - SSE实时数据推送
            - 动态帧率适配(0~165fps)
            - 智能电池路径发现
            - 双电芯支持
            - 完整数据验证
          files: out/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push version update
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add module.prop
          git commit -m "chore: auto bump version to v${{ env.VERSION }}" || true
          git push
