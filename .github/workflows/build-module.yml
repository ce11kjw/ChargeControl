name: Build Module

on:
  push:
    # 必须同时声明 branches 与 tags，否则打 tag 不会触发
    # （只写 branches 时 tag push 不匹配任何条件，v1.4.0 就因此漏发）
    branches: [ main ]
    tags: [ 'v*' ]
    # ★ monorepo：只关心模块相关路径
    #   （tag push 不受 paths 限制，保证发版一定能触发）
    paths:
      - 'src/**'
      - 'module/**'
      - 'docs/**'
      - 'Makefile'
      - 'release.sh'
      - 'update.json'
      - '.github/workflows/build-module.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════
  # x86_64：编译 + 静态分析 + 冒烟测试
  #
  # aarch64 交叉编译只能验证「编得过」，无法运行。
  # 这里编 x86_64 并在 CI 里真跑起来，用假 sysfs 做端到端测试
  # （字段完整性 / 越界值拒绝 / 慢客户端 / 内存与 fd 稳定性）。
  # 产物 test-bundle 可下载到任意 Linux 复现。
  # ═══════════════════════════════════════════════════════════
  test-x86:
    name: x86_64 build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build x86_64 (native)
        run: |
          gcc -O2 -Wall -Wextra -Wno-unused-parameter \
              -o battd-x86_64 src/battd.c
          ls -l battd-x86_64
          file battd-x86_64

      - name: Static analysis (strict warnings)
        run: |
          echo "::group::-Wformat=2 校验 JSON 模板与 200 个参数"
          gcc -O2 -Wall -Wextra -Wno-unused-parameter -Wformat=2 \
              -fsyntax-only src/battd.c
          echo "::endgroup::"

          echo "::group::-Wshadow 变量遮蔽（v1.13.0 修过一处）"
          gcc -O2 -Wall -Wextra -Wno-unused-parameter -Wshadow \
              -fsyntax-only src/battd.c
          echo "::endgroup::"

          echo "✅ 静态分析通过"

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh

      - name: Package test bundle
        run: |
          mkdir -p test-bundle/scripts
          cp battd-x86_64        test-bundle/
          cp src/battd.c         test-bundle/
          cp .github/scripts/*   test-bundle/scripts/
          cat > test-bundle/README.md <<'EOF'
          # ChargeControl 测试包

          在任何 Linux 上复现 CI 的冒烟测试：

          ```sh
          cd test-bundle
          bash scripts/smoke-test.sh
          ```

          需要：gcc、python3、curl。

          包含：
          - `battd-x86_64`  —— CI 编出的 x86_64 二进制
          - `battd.c`       —— 对应源码
          - `scripts/`      —— 冒烟测试脚本
          EOF
          tar czf ChargeControl-test-bundle.tgz -C test-bundle .
          sha256sum ChargeControl-test-bundle.tgz

      - name: Upload test bundle
        uses: actions/upload-artifact@v4
        with:
          name: ChargeControl-test-bundle
          path: ChargeControl-test-bundle.tgz
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # aarch64：交叉编译 + 打包 + 发版
  # ═══════════════════════════════════════════════════════════
  build:
    name: aarch64 build + release
    runs-on: ubuntu-latest
    needs: test-x86          # 冒烟测试通过才发版
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu zip unzip file

      - name: Read version from module.prop
        id: ver
        run: |
          V=$(grep '^version=' module/module.prop | cut -d= -f2)
          C=$(grep '^versionCode=' module/module.prop | cut -d= -f2)
          [ -n "$V" ] || { echo "::error::module.prop 缺 version"; exit 1; }
          [ -n "$C" ] || { echo "::error::module.prop 缺 versionCode"; exit 1; }
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "code=$C"    >> $GITHUB_OUTPUT
          echo "→ $V ($C)"

      - name: Build battd (aarch64 static)
        run: |
          aarch64-linux-gnu-gcc -static -O2 -s -Wall \
            -o src/battd src/battd.c
          file src/battd
          file src/battd | grep -q aarch64 || { echo "::error::不是 aarch64"; exit 1; }

      - name: Set up JDK 17 (for bundled App)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;29.0.14206865 cmake;3.22.1'

      - name: Accept Android licenses
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | xargs -r ls -t 2>/dev/null | head -1)
          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/**/*.gradle*', 'app/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build App APK (bundled into module)
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Build module zip
        run: |
          mkdir -p module/bin
          cp src/battd module/bin/battd
          chmod 755 module/bin/battd

          # ★ 把 App 一起打进模块 zip（装模块时顺带装 App）
          APK=$(find app/app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未找到 App APK"
            find app/app/build/outputs -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "打包 APK: $APK ($(stat -c%s "$APK") 字节)"
          cp "$APK" module/ChargeControl.apk
          ls -l module/ChargeControl.apk
          # 模块 zip 内固定命名 ChargeControl.zip，配合 update.json 的
          # releases/latest/download/ChargeControl.zip 永久链接
          rm -f ChargeControl.zip
          ( cd module && zip -r ../ChargeControl.zip . \
              -x '*.bak' -x '*.v*' -x '*.old' -x '*.o' )
          ls -l ChargeControl.zip

      - name: Verify
        run: |
          echo "=== zip 内容 ==="
          unzip -l ChargeControl.zip
          for f in module.prop service.sh customize.sh bin/battd webroot/index.html ChargeControl.apk; do
            unzip -l ChargeControl.zip | grep -q "$f" \
              || { echo "::error::zip 缺少 $f"; exit 1; }
          done
          # 确认 APK 是合法 zip（确认没被压坏）
          unzip -p ChargeControl.zip ChargeControl.apk > /tmp/verify.apk
          unzip -l /tmp/verify.apk > /dev/null || { echo "::error::APK 损坏"; exit 1; }
          echo "  APK 大小: $(stat -c%s /tmp/verify.apk) 字节"
          sha256sum ChargeControl.zip | tee ChargeControl.zip.sha256
          echo "✅ 校验通过"

      - name: Check tag vs module.prop
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.ver.outputs.version }}"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag ($TAG) 与 module.prop version ($VER) 不一致"
            exit 1
          fi
          echo "✅ tag 与 version 一致: $TAG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargeControl-${{ steps.ver.outputs.version }}
          path: |
            ChargeControl.zip
            ChargeControl.zip.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          tag_name: ${{ steps.ver.outputs.version }}
          files: |
            ChargeControl.zip
            ChargeControl.zip.sha256
            module/ChargeControl.apk
          generate_release_notes: true
          draft: false
