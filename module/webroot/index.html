<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电池管家</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
:root { --bg:#0f172a; --card:#1e293b; --accent:#22d3ee; --green:#4ade80; --red:#f87171; --orange:#fb923c; }
body { background:var(--bg); color:#e2e8f0; min-height:100vh; padding:16px; }
.container { max-width:560px; margin:0 auto; }
h1 { font-size:20px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
h1 .badge { font-size:11px; background:var(--accent); color:#0f172a; border-radius:20px; padding:2px 8px; font-weight:600; }
.cards { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px; }
.card { background:var(--card); border-radius:16px; padding:16px; }
.card .label { font-size:12px; color:#94a3b8; margin-bottom:6px; }
.card .value { font-size:28px; font-weight:700; }
.card .sub { font-size:12px; color:#64748b; margin-top:4px; }
.cap-bg { width:100%; height:8px; background:#334155; border-radius:4px; margin-top:10px; overflow:hidden; }
.cap-fill { height:100%; background:var(--green); border-radius:4px; transition:width .5s; }
.panel { background:var(--card); border-radius:16px; padding:16px; margin-bottom:16px; }
.panel h2 { font-size:15px; margin-bottom:12px; }
.row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #334155; }
.row:last-child { border-bottom:none; }
.row .lbl { font-size:14px; }
.row input[type=number] { width:70px; background:#0f172a; border:1px solid #334155; color:#e2e8f0; border-radius:8px; padding:6px 8px; text-align:center; font-size:14px; }
.row select { background:#0f172a; border:1px solid #334155; color:#e2e8f0; border-radius:8px; padding:6px 8px; }
.btn { background:var(--accent); color:#0f172a; border:none; border-radius:10px; padding:10px 20px; font-size:14px; font-weight:600; width:100%; cursor:pointer; margin-top:12px; }
.btn:active { opacity:.8; }
.toggle { position:relative; width:48px; height:26px; background:#334155; border-radius:13px; cursor:pointer; transition:.3s; }
.toggle.on { background:var(--green); }
.toggle::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.3s; }
.toggle.on::after { transform:translateX(22px); }
.charging { color:var(--green); }
.not-charging { color:var(--orange); }
#chartWrap { position:relative; height:180px; }
.status-line { text-align:center; font-size:13px; color:#94a3b8; padding-top:8px; }
</style>
</head>
<body>
<div class="container" x-data="app()" x-init="init()">
  <h1>🔋 电池管家 <span class="badge">v1.0.0</span></h1>

  <div class="cards">
    <div class="card">
      <div class="label">电量</div>
      <div class="value" :style="'color:' + capColor()" x-text="s.capacity + '%'"></div>
      <div class="cap-bg"><div class="cap-fill" :style="'width:' + s.capacity + '%'"></div></div>
      <div class="sub" x-text="s.status"></div>
    </div>
    <div class="card">
      <div class="label">温度</div>
      <div class="value" :style="'color:' + (s.temp >= s.temp_limit ? 'var(--red)' : 'var(--accent)')" x-text="s.temp + '°C'"></div>
      <div class="sub">上限 <span x-text="s.temp_limit + '°C'"></span></div>
    </div>
    <div class="card">
      <div class="label">电压</div>
      <div class="value" x-text="(s.voltage/1000).toFixed(2) + 'V'"></div>
      <div class="sub" x-text="s.current + ' mA'"></div>
    </div>
    <div class="card">
      <div class="label">充电限制</div>
      <div class="value" :style="s.limit_enabled ? 'color:var(--green)' : 'color:#64748b'" x-text="s.limit_enabled ? '已启用' : '已关闭'"></div>
      <div class="sub">目标 <span x-text="s.charge_limit + '%'"></span></div>
    </div>
  </div>

  <div class="panel">
    <h2>⚙️ 控制</h2>
    <div class="row">
      <span class="lbl">启用充电限制</span>
      <div class="toggle" :class="s.limit_enabled ? 'on' : ''" @click="toggleEnabled()"></div>
    </div>
    <div class="row">
      <span class="lbl">充电上限</span>
      <input type="number" min="20" max="100" x-model.number="s.charge_limit" @change="save()">
    </div>
    <div class="row">
      <span class="lbl">温度上限 (°C)</span>
      <input type="number" min="30" max="60" x-model.number="s.temp_limit" @change="save()">
    </div>
    <div class="row">
      <span class="lbl">恢复充电 (低于上限 %)</span>
      <input type="number" min="1" max="20" x-model.number="s.resume_delta" @change="save()">
    </div>
    <button class="btn" @click="save()">保存设置</button>
  </div>

  <div class="panel">
    <h2>📊 过去 1 小时趋势</h2>
    <div id="chartWrap"><canvas id="chart"></canvas></div>
    <div class="status-line" x-text="lastUpdate"></div>
  </div>
</div>

<script>
function app() {
  return {
    API_BASE: 'http://127.0.0.1:8800',

    s: { capacity: 0, temp: 0, voltage: 0, current: 0, status: 'Unknown', limit_enabled: false, charge_limit: 80, temp_limit: 45, resume_delta: 5 },
    lastUpdate: '',
    chart: null,
    timer: null,
    historyTimer: null,

    async fetchJson(url, opts) {
      try {
        const r = await fetch(url, opts);
        return await r.json();
      } catch (e) { return null; }
    },

    async poll() {
      const d = await this.fetchJson(this.API_BASE + '/api/status');
      if (d) { this.s = Object.assign(this.s, d); this.lastUpdate = '更新于 ' + new Date().toLocaleTimeString(); }
    },

    async loadHistory() {
      const h = await this.fetchJson(this.API_BASE + '/api/history');
      if (!h || !Array.isArray(h) || !h.length) return;
      const labels = h.map(x => new Date(x.t * 1000).toLocaleTimeString());
      const caps = h.map(x => x.c);
      const temps = h.map(x => x.tmp);
      if (!this.chart) {
        this.chart = new Chart(document.getElementById('chart'), {
          type: 'line',
          data: { labels, datasets: [
            { label: '电量 %', data: caps, borderColor: '#4ade80', tension: .3, yAxisID: 'y', pointRadius: 0 },
            { label: '温度 °C', data: temps, borderColor: '#fb923c', tension: .3, yAxisID: 'y1', pointRadius: 0 }
          ]},
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              y: { position: 'left', min: 0, max: 100, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
              y1: { position: 'right', min: 20, max: 60, grid: { display: false }, ticks: { color: '#94a3b8' } },
              x: { ticks: { color: '#94a3b8', maxTicksLimit: 6 } }
            },
            plugins: { legend: { labels: { color: '#e2e8f0' } } }
          }
        });
      } else {
        this.chart.data.labels = labels;
        this.chart.data.datasets[0].data = caps;
        this.chart.data.datasets[1].data = temps;
        this.chart.update();
      }
    },

    async toggleEnabled() {
      this.s.limit_enabled = !this.s.limit_enabled;
      await this.save();
    },

    async save() {
      const p = new URLSearchParams({
        charge_limit: this.s.charge_limit,
        temp_limit: this.s.temp_limit,
        resume_delta: this.s.resume_delta,
        enabled: this.s.limit_enabled ? 1 : 0
      });
      await this.fetchJson(this.API_BASE + '/api/limit', { method: 'POST', body: p.toString(), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
      this.lastUpdate = '已保存 ' + new Date().toLocaleTimeString();
    },

    capColor() {
      const c = this.s.capacity;
      return c > 80 ? 'var(--green)' : c > 30 ? 'var(--accent)' : 'var(--orange)';
    },

    init() {
      this.poll();
      this.loadHistory();
      this.timer = setInterval(() => this.poll(), 3000);
      this.historyTimer = setInterval(() => this.loadHistory(), 30000);
    }
  };
}
</script>
</body>
</html>
