<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChargeControl</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cyber-grid"></div>
    <canvas id="particles"></canvas>
    
    <div class="app-container">
        <!-- 顶部状态栏 -->
        <header class="app-header">
            <div class="header-left">
                <span class="app-title">⚡ ChargeControl</span>
                <span class="version-badge">v4.10.2</span>
            </div>
            <div class="header-right">
                <span class="connection-status" id="connectionStatus">● 连接中</span>
                <button class="icon-btn" id="themeToggle">🌙</button>
            </div>
        </header>
        
        <!-- 首页 -->
        <div class="tab-panel active" id="tab-home">
            <!-- 电量状态卡片 -->
            <div class="status-card glass-card">
                <div class="status-header">
                    <div class="status-left">
                        <div class="status-icon">🔋</div>
                        <div class="status-info">
                            <div class="status-title">电池状态</div>
                            <div class="status-subtitle" id="chargeStatus">检测中...</div>
                        </div>
                    </div>
                    <div class="status-right">
                        <div class="status-percent" id="batteryPercent">--<span>%</span></div>
                    </div>
                </div>
                <div class="status-bar">
                    <div class="status-bar-fill" id="batteryBar"></div>
                </div>
                <div class="status-meta">
                    <div class="meta-item">
                        <span class="meta-icon">⚡</span>
                        <span class="meta-label">功率</span>
                        <span class="meta-value" id="chargePower">-- W</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-icon">🌡️</span>
                        <span class="meta-label">温度</span>
                        <span class="meta-value" id="batteryTemp">-- °C</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-icon">❤️</span>
                        <span class="meta-label">健康</span>
                        <span class="meta-value" id="healthStatus">--</span>
                    </div>
                </div>
            </div>
            
            <!-- 实时数据 -->
            <div class="data-grid">
                <div class="data-card glass-card">
                    <div class="data-header">
                        <span class="data-icon">⚡</span>
                        <span class="data-title">电压</span>
                    </div>
                    <div class="data-value" id="voltage">--</div>
                    <div class="data-unit">V</div>
                </div>
                <div class="data-card glass-card">
                    <div class="data-header">
                        <span class="data-icon">🔌</span>
                        <span class="data-title">电流</span>
                    </div>
                    <div class="data-value" id="current">--</div>
                    <div class="data-unit">mA</div>
                </div>
                <div class="data-card glass-card">
                    <div class="data-header">
                        <span class="data-icon">💻</span>
                        <span class="data-title">芯片</span>
                    </div>
                    <div class="data-value" id="chipTemp">--</div>
                    <div class="data-unit">°C</div>
                </div>
                <div class="data-card glass-card">
                    <div class="data-header">
                        <span class="data-icon">💪</span>
                        <span class="data-title">功率</span>
                    </div>
                    <div class="data-value" id="power">--</div>
                    <div class="data-unit">W</div>
                </div>
            </div>
            
            <!-- 充电模式 -->
            <div class="modes-card glass-card">
                <div class="card-header">
                    <span class="card-title">⚡ 充电模式</span>
                    <span class="current-mode" id="currentMode">标准模式</span>
                </div>
                <div class="modes-grid">
                    <div class="mode-btn active" data-mode="turbo">
                        <span class="mode-icon">🚀</span>
                        <span class="mode-name">涡轮</span>
                        <span class="mode-power">240W</span>
                    </div>
                    <div class="mode-btn" data-mode="fast">
                        <span class="mode-icon">⚡</span>
                        <span class="mode-name">快充</span>
                        <span class="mode-power">120W</span>
                    </div>
                    <div class="mode-btn" data-mode="standard">
                        <span class="mode-icon">🔋</span>
                        <span class="mode-name">标准</span>
                        <span class="mode-power">60W</span>
                    </div>
                    <div class="mode-btn" data-mode="trickle">
                        <span class="mode-icon">💧</span>
                        <span class="mode-name">涓流</span>
                        <span class="mode-power">20W</span>
                    </div>
                    <div class="mode-btn" data-mode="protect">
                        <span class="mode-icon">🛡️</span>
                        <span class="mode-name">保护</span>
                        <span class="mode-power">10W</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-tab="home">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">首页</span>
            </div>
            <div class="nav-item" data-tab="stats">
                <span class="nav-icon">📊</span>
                <span class="nav-label">统计</span>
            </div>
            <div class="nav-item" data-tab="settings">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">设置</span>
            </div>
            <div class="nav-item" data-tab="logs">
                <span class="nav-icon">📝</span>
                <span class="nav-label">日志</span>
            </div>
        </nav>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script src="particles.js"></script>
    <script src="script.js"></script>
</body>
</html>
